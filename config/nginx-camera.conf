server {
    listen 127.0.0.1:8080;
    server_name localhost;

    root __PROJECT_ROOT__/web;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location = /live/live.m3u8 {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires -1;
        try_files $uri =404;
    }

    location /live/ {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location = /recordings/archive.m3u8 {
        alias __PROJECT_ROOT__/recordings/archive.m3u8;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires -1;
    }

    location /recordings/ {
        alias __PROJECT_ROOT__/recordings/;
        add_header Cache-Control "private, max-age=3600" always;
    }
}
