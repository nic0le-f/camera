server {
    listen 127.0.0.1:8080;
    server_name localhost;

    root /home/nf-box/Projects/camera/web;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # A live manifest must be fetched on every poll. Caching it makes clients
    # play old segments even when the encoder is producing fresh ones.
    location = /live/live.m3u8 {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires -1;
        try_files $uri =404;
    }

    location /live/ {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location /stream {
        proxy_pass http://192.168.1.241:81/stream;
        proxy_http_version 1.1;

        # Forward each multipart JPEG frame as soon as it arrives. Caching or
        # response buffering here causes the live view to drift behind.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_set_header Connection "";
        gzip off;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header X-Accel-Buffering "no" always;
        proxy_connect_timeout 10s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /recordings/ {
        alias /home/nf-box/Projects/camera/recordings/;
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
    }
}
