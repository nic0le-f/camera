<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Home Camera</title>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1000px;
            margin: 30px auto;
            padding: 0 20px;
            background: #111;
            color: white;
        }

        video {
            width: 100%;
            max-width: 900px;
            background: black;
            border-radius: 10px;
            display: block;
        }

        .section {
            margin-top: 30px;
        }

        a {
            color: #9ecbff;
            font-size: 1.1rem;
        }
    </style>
</head>

<body>

<h1>Home Camera</h1>

<div class="section">
    <h2>Live Feed</h2>

    <video id="video" controls autoplay muted playsinline></video>
    <p id="stream-status" role="status">Connecting to the camera…</p>
</div>

<div class="section">
    <h2>Recordings</h2>
    <p>Saved in one-hour clips and kept for approximately 48 hours.</p>
    <button id="play-all" type="button">Play all saved clips</button>
    <button id="return-live" type="button" hidden>Return to live</button>
    <p id="recordings-status" role="status"></p>
    <a href="/recordings/">View recordings</a>
</div>

<script>
const video = document.getElementById("video");
const source = "/live/live.m3u8";
const streamStatus = document.getElementById("stream-status");
const recordingsStatus = document.getElementById("recordings-status");
const playAllButton = document.getElementById("play-all");
const returnLiveButton = document.getElementById("return-live");
let playlist = [];
let playlistIndex = -1;
let hlsPlayer = null;
video.addEventListener("playing", () => { streamStatus.textContent = "Live"; });
video.addEventListener("waiting", () => { streamStatus.textContent = "Buffering video…"; });
video.addEventListener("error", () => { streamStatus.textContent = "Video could not load. Reload this page to reconnect."; });
video.addEventListener("ended", () => {
    if (playlistIndex < 0) return;
    playlistIndex++;
    if (playlistIndex >= playlist.length) {
        playlistIndex = -1;
        recordingsStatus.textContent = "Finished playing all saved clips.";
        return;
    }
    playPlaylistClip();
});

async function playPlaylistClip() {
    const clip = playlist[playlistIndex];
    recordingsStatus.textContent = `Playing clip ${playlistIndex + 1} of ${playlist.length}: ${clip.name}`;
    video.src = clip.url;
    video.load();
    try {
        await video.play();
    } catch {
        recordingsStatus.textContent = "Press play to start the saved clips.";
    }
}

playAllButton.addEventListener("click", async () => {
    recordingsStatus.textContent = "Loading saved clips…";
    try {
        const response = await fetch("/recordings/", { cache: "no-store" });
        if (!response.ok) throw new Error("Recordings page unavailable");
        const page = new DOMParser().parseFromString(await response.text(), "text/html");
        const candidates = [...page.querySelectorAll("a[href]")]
            .map(link => {
                const url = new URL(link.getAttribute("href"), response.url);
                return { url: url.href, name: decodeURIComponent(url.pathname.split("/").pop()) };
            })
            .filter(clip => /^\d{4}-\d\d-\d\d_\d\d-\d\d-\d\d\.mp4$/.test(clip.name))
            .sort((a, b) => a.name.localeCompare(b.name));
        const checked = await Promise.all(candidates.map(async clip => {
            const head = await fetch(clip.url, { method: "HEAD", cache: "no-store" });
            const size = Number(head.headers.get("Content-Length"));
            const modified = Date.parse(head.headers.get("Last-Modified") ?? "");
            return head.ok && size > 50000 && Number.isFinite(modified) && Date.now() - modified > 90000 ? clip : null;
        }));
        playlist = checked.filter(Boolean);
        if (!playlist.length) {
            recordingsStatus.textContent = "No completed clips are available yet. The current clip is added after it closes.";
            return;
        }
        if (hlsPlayer) {
            hlsPlayer.destroy();
            hlsPlayer = null;
        }
        playlistIndex = 0;
        playAllButton.hidden = true;
        returnLiveButton.hidden = false;
        streamStatus.textContent = "Playing saved clips.";
        await playPlaylistClip();
    } catch {
        recordingsStatus.textContent = "Could not load saved clips. Use View recordings to open them individually.";
    }
});
returnLiveButton.addEventListener("click", () => location.reload());

if (window.Hls && Hls.isSupported()) {
    hlsPlayer = new Hls({
        lowLatencyMode: true,
        liveSyncDurationCount: 2,
        liveMaxLatencyDurationCount: 4,
        maxLiveSyncPlaybackRate: 1.2,
        maxBufferLength: 4,
        backBufferLength: 10
    });

    hlsPlayer.loadSource(source);
    hlsPlayer.attachMedia(video);
    hlsPlayer.on(Hls.Events.ERROR, (_, data) => {
        if (data.fatal) {
            streamStatus.textContent = "Live video disconnected. Reconnecting…";
            if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
                setTimeout(() => hlsPlayer?.startLoad(-1), 2000);
            } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
                hlsPlayer?.recoverMediaError();
            } else {
                hlsPlayer?.destroy();
                hlsPlayer = null;
                streamStatus.textContent = "Video could not recover. Reload this page to reconnect.";
            }
        }
    });
    hlsPlayer.on(Hls.Events.LEVEL_UPDATED, () => {
        const liveEdge = hlsPlayer?.liveSyncPosition;
        if (liveEdge != null && liveEdge - video.currentTime > 2.5) {
            video.currentTime = liveEdge;
        }
    });
    document.addEventListener("visibilitychange", () => {
        if (!document.hidden && hlsPlayer?.liveSyncPosition != null && playlistIndex < 0) {
            video.currentTime = hlsPlayer.liveSyncPosition;
            video.play().catch(() => { streamStatus.textContent = "Press play to resume live video."; });
        }
    });
} else if (video.canPlayType("application/vnd.apple.mpegurl")) {
    video.src = source;
} else {
    streamStatus.textContent = "The video player could not start. Check your connection and reload this page.";
    video.outerHTML = "<p>This browser does not support the live video format.</p>";
}
</script>

</body>
</html>
