<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Home Camera</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { max-width: 1050px; margin: 0 auto; padding: 1.25rem; background: #101214; color: #f5f7f8; }
    header { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; }
    h1 { margin-bottom: .25rem; }
    h2 { margin-top: 0; }
    .card { margin-top: 1.5rem; padding: 1.2rem; border: 1px solid #30363b; border-radius: 14px; background: #171a1d; }
    video { display: block; width: 100%; max-height: 68vh; background: #000; border-radius: 10px; }
    .status { min-height: 1.4em; color: #b9c2c9; }
    .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: .65rem; margin: .9rem 0; }
    button, input { font: inherit; }
    button { border: 1px solid #58636c; border-radius: 7px; padding: .5rem .75rem; background: #252a2f; color: white; cursor: pointer; }
    button:hover { background: #343a40; }
    button.primary { background: #1769aa; border-color: #2784cc; }
    input[type="range"] { width: 100%; accent-color: #40a9ff; }
    .timeline-labels { display: flex; justify-content: space-between; color: #aeb8bf; font-size: .85rem; }
    .time-readout { font-variant-numeric: tabular-nums; font-weight: 650; }
    .hidden { display: none; }
    @media (max-width: 620px) { header { display: block; } .card { padding: .8rem; } }
  </style>
</head>
<body>
  <header>
    <div><h1>Home Camera</h1><div id="clock" class="status"></div></div>
  </header>

  <section class="card">
    <h2>Live feed</h2>
    <video id="live-video" controls autoplay muted playsinline></video>
    <p id="live-status" class="status" role="status">Connecting…</p>
  </section>

  <section class="card">
    <h2>Recordings</h2>
    <p>Continuous rolling history, kept for 72 hours. Use the timeline to scroll through it as one recording.</p>
    <button id="load-archive" class="primary" type="button">Open recording timeline</button>
    <div id="archive-controls" class="hidden">
      <video id="archive-video" controls muted playsinline></video>
      <div class="toolbar">
        <button type="button" data-hours="24">24 hours ago</button>
        <button type="button" data-hours="12">12 hours ago</button>
        <button type="button" data-hours="1">1 hour ago</button>
        <button id="archive-now" class="primary" type="button">Latest</button>
        <span id="archive-time" class="time-readout"></span>
      </div>
      <input id="archive-timeline" type="range" min="0" max="1" value="1" step="1" aria-label="Recording timeline">
      <div class="timeline-labels"><span id="archive-start">Oldest</span><span id="archive-end">Latest</span></div>
    </div>
    <p id="archive-status" class="status" role="status">The archive may take up to a minute to appear after recording starts.</p>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
  <script>
    const liveVideo = document.querySelector("#live-video");
    const liveStatus = document.querySelector("#live-status");
    const archiveVideo = document.querySelector("#archive-video");
    const archiveStatus = document.querySelector("#archive-status");
    const archiveControls = document.querySelector("#archive-controls");
    const loadArchiveButton = document.querySelector("#load-archive");
    const timeline = document.querySelector("#archive-timeline");
    const archiveTime = document.querySelector("#archive-time");
    const archiveStart = document.querySelector("#archive-start");
    const archiveEnd = document.querySelector("#archive-end");
    const formatTime = new Intl.DateTimeFormat([], { dateStyle: "medium", timeStyle: "medium" });
    let liveHls = null;
    let archiveHls = null;
    let dragging = false;

    function attachHls(video, url, config, onReady, onError) {
      if (window.Hls && Hls.isSupported()) {
        const player = new Hls(config);
        player.loadSource(url);
        player.attachMedia(video);
        player.on(Hls.Events.MANIFEST_PARSED, onReady);
        player.on(Hls.Events.ERROR, (_, data) => {
          if (!data.fatal) return;
          if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
            onError("Stream unavailable. Retrying…");
            setTimeout(() => player.startLoad(), 3000);
          } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
            onError("Video stalled. Recovering…");
            player.recoverMediaError();
          } else {
            onError("The video player could not recover. Reload the page to retry.");
            player.destroy();
          }
        });
        return player;
      }
      if (video.canPlayType("application/vnd.apple.mpegurl")) {
        video.src = url;
        video.addEventListener("loadedmetadata", onReady, { once: true });
        return null;
      }
      onError("This browser does not support HLS video.");
      return null;
    }

    liveHls = attachHls(
      liveVideo,
      "/live/live.m3u8",
      { lowLatencyMode: true, liveSyncDurationCount: 2, liveMaxLatencyDurationCount: 5, maxBufferLength: 5 },
      () => liveVideo.play().catch(() => { liveStatus.textContent = "Press play to start the live feed."; }),
      message => { liveStatus.textContent = message; }
    );
    liveVideo.addEventListener("playing", () => { liveStatus.textContent = "Live"; });
    liveVideo.addEventListener("waiting", () => { liveStatus.textContent = "Buffering…"; });

    function seekableWindow() {
      if (!archiveVideo.seekable.length) return null;
      return {
        start: archiveVideo.seekable.start(0),
        end: archiveVideo.seekable.end(archiveVideo.seekable.length - 1)
      };
    }

    function dateAtMediaTime(mediaTime) {
      if (archiveHls?.playingDate) {
        return new Date(archiveHls.playingDate.getTime() + (mediaTime - archiveVideo.currentTime) * 1000);
      }
      const window = seekableWindow();
      return window ? new Date(Date.now() - (window.end - mediaTime) * 1000) : null;
    }

    function updateTimeline() {
      const window = seekableWindow();
      if (!window) return;
      timeline.min = String(window.start);
      timeline.max = String(window.end);
      if (!dragging) timeline.value = String(archiveVideo.currentTime || window.end);
      const current = dateAtMediaTime(Number(timeline.value));
      const start = dateAtMediaTime(window.start);
      const end = dateAtMediaTime(window.end);
      if (current) archiveTime.textContent = formatTime.format(current);
      if (start) archiveStart.textContent = formatTime.format(start);
      if (end) archiveEnd.textContent = formatTime.format(end);
    }

    function seekHoursBack(hours) {
      const window = seekableWindow();
      if (!window) return;
      archiveVideo.currentTime = Math.max(window.start, window.end - hours * 3600);
      archiveVideo.play().catch(() => {});
      updateTimeline();
    }

    loadArchiveButton.addEventListener("click", () => {
      loadArchiveButton.disabled = true;
      archiveControls.classList.remove("hidden");
      archiveStatus.textContent = "Loading recording history…";
      archiveHls = attachHls(
        archiveVideo,
        "/recordings/archive.m3u8",
        { maxBufferLength: 90, backBufferLength: 120 },
        () => {
          archiveStatus.textContent = "Recording history loaded. Drag the timeline to any available time.";
          loadArchiveButton.classList.add("hidden");
          setTimeout(() => { seekHoursBack(24); archiveVideo.pause(); }, 250);
        },
        message => { archiveStatus.textContent = message; loadArchiveButton.disabled = false; }
      );
    });

    document.querySelectorAll("[data-hours]").forEach(button => {
      button.addEventListener("click", () => seekHoursBack(Number(button.dataset.hours)));
    });
    document.querySelector("#archive-now").addEventListener("click", () => seekHoursBack(0));
    timeline.addEventListener("pointerdown", () => { dragging = true; });
    timeline.addEventListener("input", () => {
      archiveVideo.currentTime = Number(timeline.value);
      updateTimeline();
    });
    timeline.addEventListener("change", () => { dragging = false; updateTimeline(); });
    archiveVideo.addEventListener("timeupdate", updateTimeline);
    archiveVideo.addEventListener("progress", updateTimeline);

    setInterval(() => {
      document.querySelector("#clock").textContent = formatTime.format(new Date());
      updateTimeline();
    }, 1000);
  </script>
</body>
</html>
